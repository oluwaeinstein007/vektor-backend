# See README.md in this directory for what's genuinely wired up vs. still a
# placeholder.
replicaCount: 1

image:
  repository: ghcr.io/oluwaeinstein007/vektor-coa-svc
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3010

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Non-secret config, read directly by src/index.ts (process.env.*).
env:
  QDRANT_URL: "http://vektor-qdrant:6333"
  AUDIT_SVC_URL: "http://audit-svc:3009"
  FUSION_SVC_URL: "http://fusion-svc:3007"
  VEKTOR_COA_MODE: "cloud"
  LLM_CLOUD_SVC_ADDRESS: "llm-cloud-svc:50051"

# DATABASE_URL contain credentials, so this chart expects them
# from an operator-managed Secret rather than plaintext in values.yaml:
#   kubectl create secret generic coa-svc-db --from-literal=DATABASE_URL=...
existingSecret: coa-svc-db

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
