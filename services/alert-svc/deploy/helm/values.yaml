# See README.md in this directory for what's genuinely wired up vs. still a
# placeholder.
replicaCount: 1

image:
  repository: ghcr.io/oluwaeinstein007/vektor-alert-svc
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3013

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Non-secret config, read directly by src/index.ts (process.env.*).
env:
  REDIS_URL: "redis://vektor-redis:6379"
  SMTP_URL: "smtp://vektor-maildev:1025"
  SMTP_FROM: "alerts@vektor.local"
  TWILIO_BASE_URL: "https://api.twilio.com"

# DATABASE_URL, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN contain credentials, so this chart expects them
# from an operator-managed Secret rather than plaintext in values.yaml:
#   kubectl create secret generic alert-svc-secrets --from-literal=DATABASE_URL=... --from-literal=TWILIO_ACCOUNT_SID=... --from-literal=TWILIO_AUTH_TOKEN=...
existingSecret: alert-svc-secrets

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
